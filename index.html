<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ศึกชิงดาว · ให้คะแนนกลุ่มนำเสนอ</title>
<style>
:root{--bg:#fff8ee;--card:#fff;--ink:#2b2140;--mut:#7a7090;--pri:#6c4cf1;--acc:#ff7a59;--bd:#eadfcf;--star:#ffb400;--off:#e6dccb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#17122a;--card:#241d3f;--ink:#f3eefc;--mut:#a79fc4;--pri:#9b84ff;--acc:#ff8f73;--bd:#3a3160;--off:#41386a}}
*{box-sizing:border-box}html,body{margin:0;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans Thai",Tahoma,system-ui,sans-serif;min-height:100%}
main{max-width:640px;margin:0 auto;padding:16px 14px 80px}
h1{font-size:1.5rem;margin:6px 0 2px}h2{font-size:1.1rem;margin:0 0 8px}
.sub{color:var(--mut);margin:0 0 14px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin:12px 0;box-shadow:0 4px 14px #6c4cf112}
button,select,textarea,input{font:inherit;font-size:16px;color:inherit}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn{border:0;border-radius:999px;padding:10px 16px;cursor:pointer;font-weight:600;background:var(--pri);color:#fff;margin:4px 4px 0 0}
.btn.alt{background:var(--acc)}.btn.ghost{background:var(--off);color:var(--ink)}.btn:disabled{opacity:.4}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0;flex-wrap:wrap}
.stars button{background:none;border:0;font-size:1.65rem;line-height:1;padding:2px;cursor:pointer;color:var(--off);min-width:38px;min-height:44px;transition:transform .15s}
.stars button.on{color:var(--star)}.stars button:active{transform:scale(1.35)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--bd);background:none;border-radius:999px;padding:4px 10px;cursor:pointer;font-size:.85rem;min-height:38px}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.bar{height:8px;border-radius:9px;background:var(--off);overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--acc));transition:width .4s}
.center{text-align:center;padding:30px 10px}.big{font-size:3rem}
textarea,select,input{width:100%;border:1px solid var(--bd);background:var(--bg);border-radius:12px;padding:10px;margin:4px 0}
.code{font:600 1.05rem/1.4 ui-monospace,Menlo,monospace;word-break:break-all;background:var(--off);border-radius:12px;padding:10px;margin:6px 0}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:8px;height:240px;margin:14px 0}
.pod div{flex:1;max-width:130px;border-radius:14px 14px 0 0;background:linear-gradient(var(--pri),#a98bff);color:#fff;text-align:center;padding:8px 4px;height:0;transition:height 1.4s cubic-bezier(.2,.9,.3,1.2);overflow:hidden;font-size:.85rem;font-weight:600}
.pod .p1{background:linear-gradient(#ffb400,#ff7a59)}.pod b{display:block;font-size:1.3rem}
.award{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--bd)}.award:last-child{border:0}
.c{position:fixed;top:-30px;font-size:1.6rem;pointer-events:none;animation:fall 2.2s ease-in forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.2}}
.lock{font-size:.8rem;color:var(--mut);background:var(--off);border-radius:12px;padding:8px 10px}
</style>
</head>
<body>
<main id="app"></main>
<script>
const CR=[['c','📚','เนื้อหา'],['k','💡','ความคิดสร้างสรรค์'],['d','🎤','การนำเสนอ'],['t','🤝','ทีมเวิร์ก']];
const BD=[['fire','🔥','ปังมาก'],['fun','😂','ฮาสุด'],['brain','🧠','แน่นปึ้ก'],['wow','🤩','ว้าว']];
const LS={g(k){try{return localStorage.getItem(k)}catch(e){return null}},s(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const $=s=>document.querySelector(s),app=$('#app');
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hk=n=>{let x=5381;for(const c of n.join('|'))x=((x<<5)+x+c.charCodeAt(0))>>>0;return x.toString(36).slice(0,4)};
const enc=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const dec=s=>JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/')))));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function confetti(){const e=['🎉','⭐','✨','🎊','💜','🔥'];for(let i=0;i<36;i++){const s=document.createElement('span');s.className='c';s.textContent=e[i%6];s.style.left=Math.random()*100+'vw';s.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),3200)}}
const copy=async(t,b)=>{try{await navigator.clipboard.writeText(t);if(b)b.textContent='✅ คัดลอกแล้ว'}catch(e){prompt('คัดลอกข้อความนี้',t)}};
const stars=(id,k,v)=>'<span class="stars">'+[1,2,3,4,5].map(n=>`<button data-st="${id}|${k}|${n}" class="${n<=v?'on':''}" aria-label="${n} ดาว">★</button>`).join('')+'</span>';
function animate(){document.querySelectorAll('.pod div').forEach(d=>setTimeout(()=>d.style.height=d.dataset.h+'px',100));
 document.querySelectorAll('.pod b').forEach(b=>{const t=+b.dataset.n,t0=performance.now();(function f(now){const p=Math.min(1,(now-t0)/1400);b.textContent=(t*p).toFixed(2);if(p<1)requestAnimationFrame(f)})(t0)})}
 
/* ---------- ฝั่งนักเรียน ---------- */
let S=null,names=[],K='',mine={},order=[],voted=new Set(),codes=[];
function studentInit(){try{S=dec(location.hash.slice(3))}catch(e){S=null}
 if(!S||!Array.isArray(S.n)||!S.n.length){app.innerHTML='<div class="card center"><div class="big">🔗</div>ลิงก์นี้ไม่สมบูรณ์ ขอลิงก์ใหม่จากครูนะ</div>';return}
 names=S.n;K=hk(names);order=shuffle(names.map((_,i)=>i));
 try{voted=new Set(JSON.parse(LS.g('v'+K)||'[]'));codes=JSON.parse(LS.g('c'+K)||'[]')}catch(e){}
 studentRender()}
const own=()=>LS.g('own'+K)??'';
const avail=()=>order.filter(i=>String(i)!==own()&&!voted.has(i));
const full=i=>mine[i]&&CR.every(c=>mine[i][c[0]]);
const touched=i=>mine[i]&&(CR.some(c=>mine[i][c[0]])||mine[i].b);
const done=()=>avail().filter(full).length;
const ok=()=>done()>0&&avail().every(i=>!touched(i)||full(i));
function makeCode(){const ids=avail().filter(full);
 const parts=names.map((_,i)=>ids.includes(i)?CR.map(c=>mine[i][c[0]]).join('')+(BD.findIndex(b=>b[0]===mine[i].b)+1):'-----');
 const code=K+':'+parts.join(',');codes.push(code);ids.forEach(i=>{voted.add(i);delete mine[i]});
 LS.s('c'+K,JSON.stringify(codes));LS.s('v'+K,JSON.stringify([...voted]));confetti();studentRender()}
function studentRender(){
 let h='<h1>⭐ ศึกชิงดาว</h1><p class="sub">ให้คะแนนกลุ่มนำเสนอ · ไม่ระบุตัวตน</p>';
 if(codes.length){h+=`<div class="card"><h2>🎟️ โค้ดโหวตของคุณ</h2><p class="sub">โค้ดไม่มีชื่อคุณ · ส่งให้ครูทุกโค้ดตามที่ครูบอก</p>
  ${codes.map((c,i)=>`<div class="code">${esc(c)}</div><button class="btn ghost" data-cp="${i}">📋 คัดลอกโค้ด</button>`).join('')}
  ${S.u?`<p><a class="btn alt" style="text-decoration:none;display:inline-block" href="${esc(S.u)}" target="_blank" rel="noopener">📨 ไปส่งโค้ดให้ครู</a></p>`:''}</div>`}
 if(!avail().length){h+='<div class="card center"><div class="big">✅</div><h2>โหวตครบแล้ว</h2>อย่าลืมส่งโค้ดให้ครูนะ</div>';app.innerHTML=h;return}
 const tot=names.length-(own()===''?0:1),pct=Math.round((voted.size+done())/Math.max(1,tot)*100);
 h+=`<div class="card"><div class="lock">🔒 ไม่ต้องกรอกชื่อ · ลำดับกลุ่มสลับสุ่ม · ให้ดาวได้หลายกลุ่มพร้อมกัน แล้วกดสร้างโค้ด จะทยอยสร้างหลายโค้ดก็ได้</div>
  <p style="margin:10px 0 4px"><b>กลุ่มของฉัน</b> (จะข้ามให้ · เก็บในเครื่องคุณเท่านั้น)</p>
  <select id="own"><option value="">— ไม่ได้อยู่กลุ่มไหน —</option>${names.map((n,i)=>`<option value="${i}" ${own()===String(i)?'selected':''}>${esc(n)}</option>`).join('')}</select>
  <div class="bar"><i style="width:${pct}%"></i></div></div>`;
 avail().forEach(i=>{const m=mine[i]||{};
  h+=`<div class="card"><h2>${esc(names[i])}</h2>${CR.map(c=>`<div class="row"><span>${c[1]} ${c[2]}</span>${stars(i,c[0],m[c[0]]||0)}</div>`).join('')}
  <div class="chips">${BD.map(b=>`<button class="chip ${m.b===b[0]?'on':''}" data-bd="${i}|${b[0]}">${b[1]} ${b[2]}</button>`).join('')}</div></div>`});
 app.innerHTML=h+`<button class="btn alt" id="mk" style="width:100%;padding:14px" ${ok()?'':'disabled'}>🎟️ สร้างโค้ดโหวต (${done()}/${avail().length})</button>`}
 
/* ---------- ฝั่งครู ---------- */
let res=null,info='';
const tg=()=>(LS.g('tg')||'').split('\n').map(s=>s.trim()).filter(Boolean);
function tally(){const n=tg(),k=hk(n),txt=LS.g('tc')||'',A=n.map(x=>({name:x,n:0,sum:[0,0,0,0],b:{}}));
 const toks=txt.match(/[a-z0-9]{3,8}:[-0-9,]+/gi)||[];let okc=0,bad=0;
 toks.forEach(t=>{const[kk,body]=t.split(':'),p=body.split(',');
  if(kk!==k||p.length!==n.length||!p.every(x=>/^([1-5]{4}[0-4]|-{5})$/.test(x))){bad++;return}
  okc++;p.forEach((x,i)=>{if(x[0]==='-')return;const a=A[i];a.n++;for(let j=0;j<4;j++)a.sum[j]+=+x[j];const b=+x[4];if(b)a.b[BD[b-1][0]]=(a.b[BD[b-1][0]]||0)+1})});
 const rows=A.map(a=>{const avg=a.sum.map(s=>a.n?+(s/a.n).toFixed(2):0);return{name:a.name,n:a.n,avg,b:a.b,total:a.n?+(avg.reduce((s,x)=>s+x,0)/4).toFixed(2):0}}).sort((x,y)=>y.total-x.total);
 const awards=[];CR.forEach((c,j)=>{const t=[...rows].sort((x,y)=>y.avg[j]-x.avg[j])[0];if(t&&t.n)awards.push({e:c[1],t:'เด่นด้าน'+c[2],g:t.name})});
 BD.forEach(b=>{const t=[...rows].sort((x,y)=>(y.b[b[0]]||0)-(x.b[b[0]]||0))[0];if(t&&(t.b[b[0]]||0)>0)awards.push({e:b[1],t:'รางวัล “'+b[2]+'”',g:t.name})});
 res={rows,awards};info=`นับได้ ${okc} โค้ด`+(bad?` · ใช้ไม่ได้ ${bad} โค้ด (รูปแบบผิดหรือมาจากรายชื่อกลุ่มชุดอื่น)`:'')}
function resultHTML(){const rows=res.rows;if(!rows.some(g=>g.n))return'<div class="card center"><div class="big">🤷</div>ยังไม่มีโค้ดที่นับได้</div>';
 const top=rows.slice(0,3),pod=[top[1],top[0],top[2]].map((g,i)=>g?`<div class="${i===1?'p1':''}" data-h="${[170,230,120][i]}"><span>${['🥈','🥇','🥉'][i]}</span><br>${esc(g.name)}<b data-n="${g.total}">0.00</b></div>`:'').join('');
 return`<div class="card"><h2>🏆 ผลการโหวต</h2><div class="pod">${pod}</div></div>
 <div class="card"><h2>🎖️ รางวัลพิเศษ</h2>${res.awards.map(a=>`<div class="award"><span style="font-size:1.6rem">${a.e}</span><span><b>${esc(a.g)}</b><br><small style="color:var(--mut)">${a.t}</small></span></div>`).join('')||'ยังไม่มีข้อมูล'}</div>
 <div class="card"><h2>📊 คะแนนทุกกลุ่ม</h2>${rows.map((g,i)=>`<div class="row"><span>${i+1}. ${esc(g.name)} <small style="color:var(--mut)">(${g.n} โหวต)</small></span><b>${g.total.toFixed(2)}</b></div>`).join('')}</div>`}
function teacherRender(link){
 app.innerHTML=`<h1>👩‍🏫 ศึกชิงดาว · หน้าครู</h1><p class="sub">ข้อมูลอยู่ในเครื่องนี้เท่านั้น</p>
 <div class="card"><h2>1) ตั้งกลุ่มและสร้างลิงก์นักเรียน</h2>
 <textarea id="tg" rows="5" placeholder="ชื่อกลุ่ม 1 บรรทัดต่อ 1 กลุ่ม">${esc(LS.g('tg')||'')}</textarea>
 <input id="tu" placeholder="ลิงก์รับโค้ด เช่น Google Forms (ไม่บังคับ)" value="${esc(LS.g('tu')||'')}">
 <button class="btn" data-t="link">🔗 สร้างลิงก์นักเรียน</button>
 ${link?`<div class="code">${esc(link)}</div><button class="btn alt" data-t="copy">📋 คัดลอกลิงก์ส่งเข้ากลุ่มห้อง</button>`:''}
 <p class="lock" style="margin-top:10px">แก้รายชื่อกลุ่มแล้ว ต้องสร้างลิงก์ใหม่และส่งใหม่ โค้ดเก่าจะนับไม่ได้</p></div>
 <div class="card"><h2>2) วางโค้ดที่นักเรียนส่งมา</h2>
 <textarea id="tc" rows="7" placeholder="วางโค้ดทั้งหมดที่นี่ (บรรทัดละโค้ดหรือคั่นด้วยช่องว่าง) วางข้อความปนกันได้ ระบบจะดึงเฉพาะโค้ด">${esc(LS.g('tc')||'')}</textarea>
 <button class="btn alt" data-t="sum">🎬 สรุปผล</button><button class="btn ghost" data-t="clr">🗑️ ล้างโค้ด</button>
 <p class="sub">${esc(info)}</p></div>${res?resultHTML():''}`;animate()}
 
/* ---------- ตัวควบคุม ---------- */
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(d.st){const[i,k,n]=d.st.split('|');(mine[i]=mine[i]||{})[k]=+n;return studentRender()}
 if(d.bd){const[i,b]=d.bd.split('|');const m=mine[i]=mine[i]||{};m.b=m.b===b?null:b;return studentRender()}
 if(d.cp)return copy(codes[+d.cp],t);
 if(t.id==='mk')return makeCode();
 if(d.t==='link'){const n=tg();if(!n.length)return alert('ใส่ชื่อกลุ่มก่อน');LS.s('tu',$('#tu').value.trim());
  const u=$('#tu').value.trim(),o={n};if(u)o.u=u;window._link=location.href.split('#')[0]+'#s='+enc(o);return teacherRender(window._link)}
 if(d.t==='copy')return copy(window._link,t);
 if(d.t==='sum'){tally();return teacherRender(window._link)}
 if(d.t==='clr'){if(confirm('ล้างโค้ดที่วางไว้ทั้งหมด?')){LS.s('tc','');res=null;info='';teacherRender(window._link)}}});
document.addEventListener('input',e=>{if(e.target.id==='tg')LS.s('tg',e.target.value);if(e.target.id==='tc')LS.s('tc',e.target.value);if(e.target.id==='tu')LS.s('tu',e.target.value)});
document.addEventListener('change',e=>{if(e.target.id==='own'){LS.s('own'+K,e.target.value);studentRender()}});
addEventListener('hashchange',()=>location.reload());
 
const H=location.hash;
if(H==='#teacher')teacherRender();
else if(H.startsWith('#s='))studentInit();
else app.innerHTML='<div class="card center"><div class="big">⭐</div><h2>ศึกชิงดาว</h2><p>ต้องเปิดผ่านลิงก์ที่ครูส่งให้<br><small>ครู: เติม <b>#teacher</b> ต่อท้ายลิงก์หน้านี้</small></p></div>';
</script>
</body>
</html>
